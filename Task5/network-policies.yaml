# All four Nginx pods and Services run in pd-network-demo.
# A CNI that enforces NetworkPolicy (Calico in the Minikube test) is required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: pd-network-demo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS is needed to resolve the four Kubernetes Service names during testing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: pd-network-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-end-to-back-end-api
  namespace: pd-network-demo
spec:
  podSelector:
    matchLabels: {role: front-end}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: back-end-api}
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels: {role: back-end-api}
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: back-end-api-to-front-end
  namespace: pd-network-demo
spec:
  podSelector:
    matchLabels: {role: back-end-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: front-end}
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels: {role: front-end}
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-front-end-to-admin-back-end-api
  namespace: pd-network-demo
spec:
  podSelector:
    matchLabels: {role: admin-front-end}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: admin-back-end-api}
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels: {role: admin-back-end-api}
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-back-end-api-to-admin-front-end
  namespace: pd-network-demo
spec:
  podSelector:
    matchLabels: {role: admin-back-end-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: admin-front-end}
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels: {role: admin-front-end}
      ports:
        - {protocol: TCP, port: 80}
